[project]
name = "abc-salon-api"
version = "0.1.0"
description = "ABC-Salon Phase 1 API: Jev-based message classification and a single booking-hours policy rule"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: FastAPI's `= Depends(...)` default-argument pattern is idiomatic, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use naive datetimes on purpose, matching is_open()'s own naive-time
# comparisons (see app/rules/hours.py) -- there is no real timezone to track
# in Phase 1's synthetic, single-timezone seed data.
"tests/*" = ["DTZ001"]
