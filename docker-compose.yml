services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8010:8000"
    environment:
      JEV_MODE: ${JEV_MODE:-replay}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://ai-gateway.vercel.sh/typesafe}
      CORS_ORIGINS: http://localhost:3010,http://localhost:3000
      DAILY_BUDGET_TOKENS: ${DAILY_BUDGET_TOKENS:-200000}

  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --port 3010"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8010
    ports:
      - "3010:3010"
    depends_on:
      - api

volumes:
  web_node_modules:
